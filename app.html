<style>
:root {
  --bg:#eaf4ff; --card:#fff; --text:#0f2a43; --sub:#5b7794;

html,body{height:100%;margin:0;scroll-padding-top:env(safe-area-inset-top,0px);}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow-x:hidden;}
*{box-sizing:border-box;}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;}

/* Weather Screen */
#wxBg{position:fixed;inset:0;z-index:-1;background:linear-gradient(#2f82e6,#7dbcf5);}
#weather{padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 90px;color:#fff;user-select:none;flex:1;text-shadow:0 1px 3px rgba(0,0,0,.15);}
.wx-top{text-align:center;}
.wx-city{font-size:26px;font-weight:500;cursor:default;display:inline-block;padding:6px 14px;}
.wx-icon-el{font-size:54px;margin:8px 0;cursor:pointer;-webkit-touch-callout:none;}
.wx-temp{font-size:88px;font-weight:200;line-height:1;margin:0;}
.wx-cond{font-size:19px;opacity:.95;}
.wx-hilo{font-size:16px;opacity:.9;margin-top:2px;white-space:pre;}
