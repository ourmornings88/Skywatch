<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyWatch Weather</title>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root {
  --bg:#2f82e6; --card:rgba(255,255,255,0.18); --text:#fff;
  --accent:#2b8aef; --me:#2b8aef; --me-t:#fff;
  --them:#e7edf3; --them-t:#0f2a43;
}
html, body { height:100%; margin:0; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow-x:hidden; transition: background 0.5s ease; }
#app { max-width:480px; margin:0 auto; min-height:100%; display:flex; flex-direction:column; position:relative; }

#weather { padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 40px; color:#fff; user-select:none; flex:1; text-shadow:0 1px 3px rgba(0,0,0,.15); }
.wx-top { text-align:center; }
.wx-city { font-size:26px; font-weight:500; cursor:default; display:inline-block; padding:6px 14px; }
.wx-icon-el { font-size:54px; margin:8px 0; cursor:pointer; -webkit-touch-callout:none; }
.wx-temp { font-size:88px; font-weight:200; line-height:1; margin:0; cursor:pointer; }
.wx-cond { font-size:19px; opacity:.95; }
.wx-hilo { font-size:16px; opacity:.9; margin-top:2px; white-space:pre; }
.wc { background:var(--card); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-radius:18px; padding:14px 16px; margin-top:14px; }
.wc h4 { margin:0 0 10px; font-size:12px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.05em; }
.hrs { display:flex; gap:18px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
.hrs::-webkit-scrollbar { display:none; }
.hr { display:flex; flex-direction:column; align-items:center; gap:6px; min-width:42px; font-size:15px; }
.hr small { font-size:12px; opacity:.85; white-space:nowrap; }
.dy { display:flex; align-items:center; gap:8px; padding:9px 0; border-top:1px solid rgba(255,255,255,.2); font-size:16px; }
.dy:first-of-type { border-top:none; }
.dy .d { width:52px; } .dy .i { width:30px; text-align:center; } .dy .l { width:34px; text-align:right; opacity:.7; } .dy .h { width:34px; }
.bar { flex:1; height:5px; border-radius:3px; background:rgba(255,255,255,.25); position:relative; }
.bar i { position:absolute; top:0; bottom:0; border-radius:3px; background:linear-gradient(90deg,#7fd1ff,#ffd36b); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
.grid .wc { margin-top:0; }
.grid b { font-size:22px; font-weight:300; display:block; }
.wx-err { text-align:center; padding:20px 10px; opacity:.9; }

#panicZone { position:fixed; bottom:0; right:0; width:80px; height:80px; z-index:30; -webkit-tap-highlight-color:transparent; }

/* Overlay Screens */
#overlay { position:fixed; inset:0; background:#eaf4ff; color:#0f2a43; display:none; flex-direction:column; z-index:100; }
#overlay.show { display:flex; }

#pinScreen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:30px; }
.pin-label { font-size:16px; font-weight:600; }
.pin-dots { display:flex; gap:14px; }
.pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid #5b7794; background:transparent; }
.pin-dot.filled { background:#2b8aef; border-color:#2b8aef; }
.pin-error { color:#d9534f; font-size:13px; height:16px; text-align:center; }
.keypad { display:grid; grid-template-columns:repeat(3,68px); gap:14px; }
.keypad button { width:68px; height:68px; border-radius:50%; border:1px solid rgba(128,128,128,.25); background:#fff; color:#0f2a43; font-size:22px; cursor:pointer; }
.keypad button:active { background:#2b8aef; color:#fff; }
.btn-ghost { background:none; border:none; color:#5b7794; font-size:13px; cursor:pointer; padding:8px; }

#licenseScreen, #setupScreen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; }
.setup-title { font-size:17px; font-weight:600; }
.hint { font-size:12px; color:#5b7794; text-align:center; max-width:260px; line-height:1.5; }
#licenseInput, #roomInput { width:100%; max-width:260px; text-align:center; font-size:16px; padding:10px; border-radius:10px; border:1px solid rgba(128,128,128,.3); background:#fff; color:#0f2a43; outline:none; }
.btn-primary { background:#2b8aef; color:#fff; border:none; border-radius:10px; padding:10px 22px; font-size:15px; cursor:pointer; font-weight:600; }

#chatScreen { flex:1; display:flex; flex-direction:column; background:#eaf4ff; }
.chat-hdr { display:flex; align-items:center; gap:10px; padding:12px 16px; background:#fff; border-bottom:1px solid rgba(128,128,128,.15); }
.chat-hdr .hbtn { background:none; border:none; color:#2b8aef; font-size:15px; cursor:pointer; }
.chat-hdr .title { font-weight:600; flex:1; font-size:15px; color:#0f2a43; }
.chat-hdr .clearbtn { font-size:13px; color:#c0392b; background:none; border:none; cursor:pointer; }
#status { font-size:12px; color:#5b7794; text-align:center; padding:4px 16px; min-height:22px; }
#messages { flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:8px; }
.bubble { max-width:76%; padding:9px 13px; border-radius:16px; font-size:15px; line-height:1.4; word-wrap:break-word; }
.me { align-self:flex-end; background:#2b8aef; color:#fff; border-bottom-right-radius:4px; }
.them { align-self:flex-start; background:#e7edf3; color:#0f2a43; border-bottom-left-radius:4px; }
.ts { font-size:10px; opacity:.55; margin-top:2px; display:block; }
.chat-inp { display:flex; gap:8px; padding:10px; background:#fff; border-top:1px solid rgba(128,128,128,.15); }
#msgInput { flex:1; border:1px solid rgba(128,128,128,.3); border-radius:20px; padding:9px 14px; font-size:15px; background:#eaf4ff; color:#0f2a43; outline:none; }
#sendBtn { background:#2b8aef; color:#fff; border:none; border-radius:20px; padding:9px 16px; font-size:14px; cursor:pointer; font-weight:600; }

#galleryScreen { flex:1; display:flex; flex-direction:column; background:#fff; }
.gal-hdr { display:flex; align-items:center; gap:10px; padding:14px 16px; background:#fff; border-bottom:1px solid rgba(128,128,128,.15); }
.gal-grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
.gal-grid img { width:100%; aspect-ratio:1; object-fit:cover; cursor:pointer; }
.gal-add { display:flex; align-items:center; justify-content:center; aspect-ratio:1; background:#e7edf3; color:#5b7794; font-size:30px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">

<div id="weather">
  <div class="wx-top">
    <div class="wx-city" id="wxCity">Loading…</div>
    <div class="wx-icon-el" id="wxIconEl">🌤️</div>
    <div class="wx-temp" id="wxTemp">--°</div>
    <div class="wx-cond" id="wxCond"></div>
    <div class="wx-hilo" id="wxHilo"></div>
  </div>
  <div class="wc"><h4>Hourly Forecast</h4><div class="hrs" id="wxHrs"></div></div>
  <div class="wc"><h4>10-Day Forecast</h4><div id="wxDays"></div></div>
  <div class="grid" id="wxGrid"></div>
  <div class="wx-err" id="wxErr"></div>
</div>

<div id="panicZone"></div>

<div id="overlay">
  <div id="pinScreen">
    <div class="pin-label">Enter code</div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-error" id="pinError"></div>
    <div class="keypad" id="keypad"></div>
    <button class="btn-ghost" id="pinCancel">Back to weather</button>
  </div>

  <div id="licenseScreen" style="display:none;">
    <div class="setup-title">Activate App</div>
    <div class="hint">Enter your license key to unlock SkyWatch.</div>
    <input id="licenseInput" placeholder="License Key">
    <div class="hint" id="licenseError" style="color:#d9534f;min-height:20px;"></div>
    <button class="btn-primary" id="activateBtn">Activate</button>
    <button class="btn-ghost" id="cancelLicense">Back</button>
  </div>

  <div id="setupScreen" style="display:none;">
    <div class="setup-title">Enter Secret Phrase</div>
    <div class="hint">Both people type the exact same phrase to connect securely.</div>
    <input id="roomInput" placeholder="e.g. secret-phrase-xyz">
    <button class="btn-primary" id="joinBtn">Join Chat</button>
    <button class="btn-ghost" id="cancelSetup">Back</button>
  </div>

  <div id="chatScreen" style="display:none;">
    <div class="chat-hdr">
      <button class="hbtn" id="hideBtn">‹ Hide</button>
      <div class="title">Chat 🔒 encrypted</div>
      <button class="clearbtn" id="clearBtn">Clear</button>
    </div>
    <div id="status"></div>
    <div id="messages"></div>
    <div class="chat-inp">
      <input id="msgInput" placeholder="Message…">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div id="galleryScreen" style="display:none;">
    <div class="gal-hdr">
      <button id="galleryBack" class="btn-ghost" style="color:#2b8aef;">‹ Back</button>
      <div style="font-weight:600; flex:1;">Photos</div>
    </div>
    <div class="gal-grid" id="galleryGrid"><div class="gal-add" id="galleryAdd">＋</div></div>
    <input type="file" id="galleryFile" accept="image/*" multiple style="display:none;">
  </div>
</div>

<div id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" src="">
  <button class="lb-del" id="lbDelete">Delete</button>
</div>

</div>

const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

const hex = buf => [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');

async function pbkdf2(secret, salt, iter, bits) {
  const k = await crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: iter }, k, bits);
}
async function deriveRoom(phrase) {
  const [idBits, keyBits] = await Promise.all([
    pbkdf2(phrase, 'skywatch/room/v1', 100000, 128),
    pbkdf2(phrase, 'skywatch/key/v1', 100000, 256)
  ]);
  return { roomId: hex(idBits), key: await crypto.subtle.importKey('raw', keyBits, 'AES-GCM', false, ['encrypt', 'decrypt']) };
}
async function encryptMsg(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return { c: b64(ct), iv: b64(iv) };
}
async function decryptMsg(key, m) {
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(m.iv) }, key, unb64(m.c))));
}
